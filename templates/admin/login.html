<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | EarthX Designs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="admin-body">

    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="{{ url_for('static', filename='uploads/logo_black.png') }}" alt="EarthX Designs Logo" style="height: 60px; width: auto;">
            </div>
            <div class="login-subtitle">CMS Administration Portal</div>
            
            <!-- Flash Alert messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div style="margin-bottom: 1.5rem;">
                        {% for category, message in messages %}
                            <div style="padding: 0.8rem 1rem; border-radius: 6px; font-size: 0.85rem; font-weight: 500; margin-bottom: 0.5rem; 
                                        {% if category == 'error' %} background-color: #FEE2E2; color: #991B1B; border: 1px solid #FCA5A5; {% else %} background-color: #D1FAE5; color: #065F46; border: 1px solid #6EE7B7; {% endif %}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}
            
            <form action="{{ url_for('admin_login') }}" method="POST">
                <div class="admin-form-group">
                    <label for="email">Admin Email</label>
                    <input type="email" id="email" name="email" required placeholder="admin@earthxdesigns.com" style="padding: 0.85rem 1rem;">
                </div>
                
                <div class="admin-form-group" style="margin-bottom: 1.8rem;">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••" style="padding: 0.85rem 1rem;">
                </div>
                
                <button type="submit" class="btn-admin btn-admin-primary" style="width: 100%; justify-content: center; padding: 0.85rem; font-size: 0.95rem; border-radius: 6px;">
                    <span>Sign In</span>
                </button>
            </form>
            
            <div style="text-align: center; margin-top: 1.8rem;">
                <a href="{{ url_for('home') }}" style="color: var(--admin-text-light); text-decoration: none; font-size: 0.88rem; display: inline-flex; align-items: center; gap: 6px;">
                    <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
                    <span>Back to Website</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
